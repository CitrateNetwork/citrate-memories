# Hermes knowledge corpus (HUP-S3.1). Built at release time by
# `scripts/build-corpus.sh` into per-tenant SyncBundles + manifest.json +
# skills.lock + NOTICE.md, then shipped inside the citrate-core app bundle and
# imported into the member's local memory graph on first run.
#
# Paths are relative to the sources base: the citrate-labs federation root,
# where each source is a checkout. `commit = "git"` records the checkout's HEAD
# (suffixed `-dirty` when the tree differs from HEAD). Skills sources take their
# commit and file hashes from the HUP-S3.6 skills.lock in citrate-core.
#
# Citations (format 2): `repo` is the repository a source's nodes cite and
# `repo_path` is where `root` sits inside it, so every node's source_ref reads
# `<repo>:<repo-relative path>` (the shape the Citrate QA eval checks).
#
# Optional reference checkouts (Solady, the Foundry book, Medusa, Slither) are
# fetched at pinned commits by `scripts/fetch-corpus-refs.sh <sources-base>`.
#
# Licence state: `licence_cleared = false` sources are listed in the manifest
# and never read. Every source below is cleared; Medusa and Slither docs
# (AGPL-3.0) by owner decision on 2026-10-01.

version = 1
name = "hermes-knowledge"
max_chunk_chars = 1200

# ---- citrate-docs tenant ---------------------------------------------------

[[source]]
id = "citrate-docs"
tenant = "citrate-docs"
kind = "docs"
root = "citrate-docs/content"
repo = "citrate-docs"
repo_path = "content"
upstream = "https://github.com/CitrateNetwork/citrate-docs"
license = "Apache-2.0 (citrate-docs LICENSE)"
licence_cleared = true
licence_note = "first party; public tier only"
commit = "git"
extensions = ["md", "mdx"]
require_frontmatter = { tier = "public" }

