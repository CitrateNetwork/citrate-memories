# ---- methodology tenant ----------------------------------------------------

[[source]]
id = "agentile"
tenant = "methodology"
kind = "docs"
root = "."
repo = "citrate-labs"
upstream = "https://github.com/CitrateNetwork (citrate-labs AGENTILE.md)"
license = "Citrate Inc. (first party)"
licence_cleared = true
commit = "git"
include = ["AGENTILE.md"]

[[source]]
id = "agentile-docs"
tenant = "methodology"
kind = "docs"
root = "agentile-skills/docs"
repo = "agentile-skills"
repo_path = "docs"
upstream = "https://github.com/CitrateNetwork/agentile-skills"
license = "Apache-2.0"
licence_cleared = true
commit = "git"
