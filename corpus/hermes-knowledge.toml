repo = "trailofbits-skills"
upstream = "https://github.com/trailofbits/skills"
license = "CC-BY-SA-4.0"
licence_cleared = true
licence_note = "D-20 (owner, 2026-09-30): cleared for redistribution with attribution and a note of changes"
attribution = "Trail of Bits skills (https://github.com/trailofbits/skills), licensed CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/). Changed: executables stripped, text chunked."
skills_lock = "citrate-core/skills.lock"
lock_source = "trailofbits"

