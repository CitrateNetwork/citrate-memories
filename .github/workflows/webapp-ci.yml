name: webapp-ci

# Memrizz webapp gates (planset §3.B.7): hermetic typecheck → lint → test →
# build, plus the test-count ratchet (Rule 3 — never decreases). Scoped to
# webapp/** so Rust-only changes don't trigger it (the Rust workspace has its own
# ci.yml). Federation-wide gitleaks runs from the repo-root secret-scan.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['webapp/**', '.github/workflows/webapp-ci.yml']
  pull_request:
    paths: ['webapp/**']

defaults:
  run:
    working-directory: webapp

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Test-count ratchet (Rule 3 — never decreases)
        run: |
          baseline=$(node -e "process.stdout.write(String(require('./.agentile/coverage/baseline.json').tests.count))")
          actual=$(pnpm vitest run --reporter=json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(String(JSON.parse(d).numTotalTests)))")
          echo "baseline=$baseline actual=$actual"
          if [ "$actual" -lt "$baseline" ]; then
            echo "::error::test count $actual is below baseline $baseline (Rule 3 ratchet)"; exit 1
          fi
