name: ci

# citrate-memories CI: workspace tests (Rule 2 — count only goes up), clippy
# (Rule 8 — zero warnings), and the WP-0.5 TLC gate (model-check every TLA+
# spec; a violated invariant fails the build — the one hard block).

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # mem-ingest git tests read this repo's own full history
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo test (workspace)
        run: cargo test --workspace
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      # PBA R2 (2026-09-24 audit): the gateway's HTTP surface (`http.rs`, every
      # authz regression test for it) is behind the `server` feature and the
      # mem-sync HTTP transport behind `http`. `--workspace` enables neither, so
      # those tests (and their tripwires) never ran in CI. Run them explicitly.
      - name: cargo test (feature-gated surfaces — gateway server, sync http)
        run: |
          cargo test -p mem-gateway --features server
          cargo test -p mem-sync --features http
      - name: clippy -D warnings (feature-gated surfaces)
        run: |
          cargo clippy -p mem-gateway --features server --all-targets -- -D warnings
          cargo clippy -p mem-sync --features http --all-targets -- -D warnings

  bge-golden:
    # The bge-base-en-v1.5 golden test (crates/mem-index/tests/bge_golden.rs):
    # token ids must match the candle 0.10.2 fixture exactly, and each vector
    # within cosine >= 0.99999 and max abs diff <= 1e-5, or stored indexes would
    # need a re-embed. It needs the real weights, so it is #[ignore]d in the
    # workspace run and runs here with --include-ignored, after the pinned
    # tarball's sha256 is checked. Also clippy for the `transformer` feature,
    # which no other job builds. Both CPU paths: x86_64 (AVX2) and aarch64
    # (NEON); the fixture is the x86_64 Linux dump, and aarch64 is within the
    # same tolerance of it (measured 2.6e-7 max abs diff).
    name: bge-golden (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # bge-base-en-v1.5.tar.gz on CitrateNetwork/citrate-core `runtime-deps`
      # (HF snapshot a5beb1e3), the bytes citrate-core bundles.
      BGE_SHA256: cea05ebe680cf315e41c965caec9d8e009dd9085b622d4cb9c62fe4faf026c3b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Fetch the pinned bge-base-en-v1.5 weights (sha256 verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download runtime-deps -R CitrateNetwork/citrate-core \
            -p bge-base-en-v1.5.tar.gz -D "$RUNNER_TEMP"
          echo "$BGE_SHA256  $RUNNER_TEMP/bge-base-en-v1.5.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/bge-base-en-v1.5.tar.gz" -C "$RUNNER_TEMP"
          echo "CITRATE_BGE_MODEL_DIR=$RUNNER_TEMP/bge-base-en-v1.5" >> "$GITHUB_ENV"
      - name: clippy -D warnings (mem-index transformer)
        run: cargo clippy -p mem-index --features transformer --all-targets --locked -- -D warnings
      - name: bge golden test (and the bge end-to-end test)
        run: |
          set -euo pipefail
          cargo test -p mem-index --features transformer --release --locked \
            -- --include-ignored --show-output 2>&1 | tee "$RUNNER_TEMP/bge-test.log"
          # Fail if the golden test was filtered out or skipped instead of run.
          grep -q "test bge_embeddings_match_candle_0_10_2_golden ... ok" "$RUNNER_TEMP/bge-test.log"
          grep -q "test transformer::tests::bge_base_end_to_end ... ok" "$RUNNER_TEMP/bge-test.log"

  cargo-audit:
    # MEM-B-015: fail the build on a known-vulnerable dependency (RUSTSEC). The
    # gateway's h2/hyper HTTP listener is unauthenticated at the framing layer, so
    # a codec advisory is directly reachable. Default `cargo audit` fails on
    # VULNERABILITIES (not merely unmaintained/unsound warnings), so a new RUSTSEC
    # vuln hard-blocks the merge while the accepted transformer-stack warnings do
    # not perpetually redden CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
      # Accepted advisories in .cargo/audit.toml expire and must still be
      # reported; this fails the job otherwise.
      - name: audit ignores are honest
        run: |
          python3 scripts/check_audit_ignores.py --self-test
          python3 scripts/check_audit_ignores.py

  tla-model-check:
    # WP-0.5 gate: TLC over SupersededDag / Ingestion / Authz. This is where a
    # broken safety invariant hard-blocks the merge (it caught the SupersededDag
    # reachability bug on 2026-06-11). Complements the soft trailer nudge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Temurin JRE
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch tla2tools.jar
        run: |
          mkdir -p "$HOME/.local/share/tla"
          curl -fsSL -o "$HOME/.local/share/tla/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - name: TLC model-check all specs
        env:
          TLA_TOOLS: ${{ github.workspace }}/.tla/tla2tools.jar
        run: |
          export TLA_TOOLS="$HOME/.local/share/tla/tla2tools.jar"
          ./specs/check.sh

  hic-terminology:
    name: HIC terminology guard (public-claims accuracy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: HIC terminology in docs, UI strings, comments and descriptions
        run: |
          python3 scripts/check_hic_terminology.py --self-test
          python3 scripts/check_hic_terminology.py
