name: ci

# citrate-memories CI: workspace tests (Rule 2 — count only goes up), clippy
# (Rule 8 — zero warnings), and the WP-0.5 TLC gate (model-check every TLA+
# spec; a violated invariant fails the build — the one hard block).

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # mem-ingest git tests read this repo's own full history
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo test (workspace)
        run: cargo test --workspace
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      # PBA R2 (2026-09-24 audit): the gateway's HTTP surface (`http.rs`, every
      # authz regression test for it) is behind the `server` feature and the
      # mem-sync HTTP transport behind `http`. `--workspace` enables neither, so
      # those tests (and their tripwires) never ran in CI. Run them explicitly.
      - name: cargo test (feature-gated surfaces — gateway server, sync http)
        run: |
          cargo test -p mem-gateway --features server
          cargo test -p mem-sync --features http
      - name: clippy -D warnings (feature-gated surfaces)
        run: |
          cargo clippy -p mem-gateway --features server --all-targets -- -D warnings
          cargo clippy -p mem-sync --features http --all-targets -- -D warnings

  cargo-audit:
    # MEM-B-015: fail the build on a known-vulnerable dependency (RUSTSEC). The
    # gateway's h2/hyper HTTP listener is unauthenticated at the framing layer, so
    # a codec advisory is directly reachable. Default `cargo audit` fails on
    # VULNERABILITIES (not merely unmaintained/unsound warnings), so a new RUSTSEC
    # vuln hard-blocks the merge while the accepted transformer-stack warnings do
    # not perpetually redden CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  tla-model-check:
    # WP-0.5 gate: TLC over SupersededDag / Ingestion / Authz. This is where a
    # broken safety invariant hard-blocks the merge (it caught the SupersededDag
    # reachability bug on 2026-06-11). Complements the soft trailer nudge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Temurin JRE
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch tla2tools.jar
        run: |
          mkdir -p "$HOME/.local/share/tla"
          curl -fsSL -o "$HOME/.local/share/tla/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - name: TLC model-check all specs
        env:
          TLA_TOOLS: ${{ github.workspace }}/.tla/tla2tools.jar
        run: |
          export TLA_TOOLS="$HOME/.local/share/tla/tla2tools.jar"
          ./specs/check.sh

  hic-terminology:
    name: HIC terminology guard (public-claims accuracy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: HIC terminology in docs, UI strings, comments and descriptions
        run: |
          python3 scripts/check_hic_terminology.py --self-test
          python3 scripts/check_hic_terminology.py
