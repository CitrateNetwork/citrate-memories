# citrate-memories: accepted advisories, with reasons and an expiry.
#
# `cargo audit` stops reporting an advisory once it is listed here, so
# scripts/check_audit_ignores.py runs in the CI audit step and fails when the
# expiry passes or when an ignored advisory is no longer reported (stale).
#
# 2026-11-08: empty. The zip extract() advisories RUSTSEC-2026-0367/-0368/-0369
# (accepted 2026-10-23, expiring 2026-11-09) and RUSTSEC-2026-0429 are FIXED, not
# renewed: candle 0.11.1 accepts zip ^9.1.3, which removed the blocker (candle
# 0.10.x pinned zip ^7.2). mem-index now uses candle-core/-nn/-transformers 0.11.1
# and tokenizers 0.23 (unified with candle's), and the lockfile resolves zip 9.5.0.
#
# A new entry needs: the advisory id, why it is not reachable or not fixable, the
# blocker, the owner's approval, and an EXPIRES date. Do not renew by reflex.

[advisories]
ignore = []
