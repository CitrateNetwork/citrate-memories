# citrate-memories: accepted advisories, with reasons and an expiry.
#
# `cargo audit` stops reporting an advisory once it is listed here, so
# scripts/check_audit_ignores.py runs in the CI audit step and fails when the
# expiry passes or when an ignored advisory is no longer reported (stale).
#
# 2026-11-24: no accepted advisories. The zip extract() advisories
# RUSTSEC-2026-0367, -0368 and -0369 (accepted 2026-10-23, expired 2026-11-09)
# are fixed, not renewed: candle 0.11.1 accepts zip ^9.1.3 (candle 0.10.x
# required zip ^7.2), and Cargo.lock now resolves a single zip 9.x.
#
# A new entry needs: the advisory id, why it is not reachable or not fixable,
# the blocker, the owner's approval, and a `# EXPIRES: YYYY-MM-DD` line.
# Do not renew by reflex.

[advisories]
ignore = []
