[package]
name = "mem-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-memories MCP server: JSON-RPC tools over the read path, authz-gated and audited."

[dependencies]
mem-core = { path = "../mem-core" }
mem-store = { path = "../mem-store" }
mem-index = { path = "../mem-index" }
mem-query = { path = "../mem-query" }
mem-authz = { path = "../mem-authz" }
mem-assert = { path = "../mem-assert" }
serde_json = { workspace = true }
ed25519-dalek = "2"
# The `mem-mcp` daemon binary: blake3 derives its domain-separated identity from
# the keyring-held wrapping key, hex decodes that key, getrandom seeds the
# ephemeral fallback identity.
blake3 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }

[features]
default = []
rocksdb = ["mem-store/rocksdb"]
# Lets the stdio server query a bge-embedded graph (auto-detected at startup).
transformer = ["mem-query/transformer"]

[[example]]
name = "mcp_demo"
required-features = ["rocksdb"]

[[example]]
name = "mcp_stdio"
required-features = ["rocksdb"]

# The daemon binary. Promoted from `examples/mcp_serve.rs` (2026-07-25) because
# citrate-core declares `binaries/mem-mcp` as a Tauri externalBin and
# `tauri-build` validates every such path — the desktop app could not be packaged
# while the daemon existed only as an example.
#
# `required-features` means you MUST build it as:
#   cargo build -p mem-mcp --bin mem-mcp --release --features rocksdb
# Without the feature cargo reports "no bin target named `mem-mcp`".
[[bin]]
name = "mem-mcp"
path = "src/main.rs"
required-features = ["rocksdb"]

[[example]]
name = "mcp_connect"

