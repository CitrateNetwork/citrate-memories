[package]
name = "mem-index"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-memories vector layer: embedders and model-version-guarded vector index."

[dependencies]
mem-core = { path = "../mem-core" }
blake3.workspace = true

# WP-0.4b transformer embedder (feature `transformer`): candle BERT + HF tokenizer.
# Off by default so the baseline build stays pure-Rust and dependency-light; the
# HashingEmbedder remains the no-deps fallback.
candle-core = { version = "0.11.1", optional = true }
candle-nn = { version = "0.11.1", optional = true }
candle-transformers = { version = "0.11.1", optional = true }
# Match the version + regex backend candle-core already pulls in. candle-core
# 0.11 has a hard `tokenizers ^0.23.1` dep with default features off and only
# `fancy-regex`, so asking for the same set unifies to one compiled tokenizers
# with one regex backend (asking for `onig` as 0.10 did would compile both:
# onig shadows fancy-regex inside tokenizers, and the C oniguruma build comes
# back). bge's tokenizer.json never reaches the regex backend: its pipeline is
# BertNormalizer, BertPreTokenizer (char-class splitting, no regex), WordPiece
# and a TemplateProcessing [CLS]/[SEP] post-processor. The bge golden test
# (tests/bge_golden.rs) pins the token ids exactly.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }
hf-hub = { version = "0.4", optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
transformer = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
    "dep:serde_json",
]

