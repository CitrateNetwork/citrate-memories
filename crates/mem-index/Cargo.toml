[package]
name = "mem-index"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-memories vector layer: embedders and model-version-guarded vector index."

[dependencies]
mem-core = { path = "../mem-core" }
blake3.workspace = true

# WP-0.4b transformer embedder (feature `transformer`): candle BERT + HF tokenizer.
# Off by default so the baseline build stays pure-Rust and dependency-light; the
# HashingEmbedder remains the no-deps fallback.
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
# Match the version + `onig` backend candle-core already pulls in (its tokenizers
# dep is hard + onig-only), so the two unify to a single compiled crate instead of
# duplicating tokenizers.
tokenizers = { version = "0.22", default-features = false, features = ["onig"], optional = true }
hf-hub = { version = "0.4", optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
transformer = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
    "dep:serde_json",
]
