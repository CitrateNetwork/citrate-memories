[package]
name = "mem-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-memories Derived-plane ingestion: git history + trailers -> nodes/edges."

[dependencies]
mem-core = { path = "../mem-core" }
mem-store = { path = "../mem-store" }
mem-index = { path = "../mem-index" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
default = []
# Enables the persistent RocksDB-backed backfill example.
rocksdb = ["mem-store/rocksdb"]

[[example]]
name = "backfill"
required-features = ["rocksdb"]
