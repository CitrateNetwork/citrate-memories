[package]
name = "mem-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-memories storage: generic content-addressed DAG over a KvStore backend."

[dependencies]
mem-core = { path = "../mem-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
hex.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
rocksdb = { version = "0.22", optional = true, default-features = false, features = ["snappy"] }

[features]
default = []
# Durable RocksDB backend (same KvStore trait). Off by default so the standard
# `cargo test` stays fast and the in-memory backend is the test default.
rocksdb = ["dep:rocksdb"]

[[example]]
name = "repair_store"
required-features = ["rocksdb"]

[[example]]
name = "reencrypt"
required-features = ["rocksdb"]

[[example]]
name = "shred"
required-features = ["rocksdb"]
