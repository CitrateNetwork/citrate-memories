[package]
name = "mem-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Memrizz backend seam: multi-Org isolation, OIDC->grant authz, and the network surface over the citrate-memories engine."

[dependencies]
mem-core = { path = "../mem-core" }
mem-store = { path = "../mem-store" }
mem-query = { path = "../mem-query" }
mem-index = { path = "../mem-index" }
mem-authz = { path = "../mem-authz" }
# Signing identity for the HTTP write routes (gap G-1): assert / propose_edge.
mem-assert = { path = "../mem-assert" }
# The JSON-RPC tool surface, reused behind the MCP-over-HTTP endpoint (gap G-7).
mem-mcp = { path = "../mem-mcp" }
# Durability/ops: anchors + tenant-root for the ops surface (WP-6.5).
mem-sync = { path = "../mem-sync" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = "2"
blake3 = { workspace = true }
# Real OIDC bearer verification (gap G-2): RS256 JWT against the authority JWKS,
# enforcing issuer + audience + expiry. Core (not behind `server`) so the
# fail-closed auth path is covered by the default `cargo test --workspace`.
jsonwebtoken = "9"
# HTTP layer (feature `server`): kept optional so the security-critical core tests
# compile without the tokio/axum tree.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }
axum = { version = "0.7", optional = true }

[features]
default = []
# Open per-Org RocksDB stores (the real engine backend). Off by default so the
# control-plane + authz core tests stay fast on the in-memory path.
rocksdb = ["mem-store/rocksdb", "mem-query/rocksdb"]
# The axum HTTP/JSON read API + 3D-layout endpoint.
server = ["dep:tokio", "dep:axum"]
# Surface the on-chain anchor (tenant-root → 40204 block) in the ops route.
chain = ["mem-sync/chain"]
# Load the bge transformer embedder (needed for `search` over a bge-embedded store).
transformer = ["mem-index/transformer", "mem-query/transformer"]

[[bin]]
name = "mem-gateway"
required-features = ["server", "rocksdb"]
