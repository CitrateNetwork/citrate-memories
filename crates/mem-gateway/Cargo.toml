[package]
name = "mem-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "HTTP gateway over the citrate-memories DAG: OIDC-gated, Org-scoped recall/search/assert + MCP-over-HTTP (BYOM). Net-new transport over the proven mem-{store,query,assert,authz,mcp} primitives."

[dependencies]
mem-core = { path = "../mem-core" }
mem-store = { path = "../mem-store" }
mem-index = { path = "../mem-index" }
mem-ingest = { path = "../mem-ingest" }
mem-query = { path = "../mem-query" }
mem-authz = { path = "../mem-authz" }
mem-assert = { path = "../mem-assert" }
mem-mcp = { path = "../mem-mcp" }

serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = "2"
# MEM-S7 WP-7.2: GitHub webhook HMAC-SHA256 (X-Hub-Signature-256) verification.
hmac = "0.12"
sha2 = "0.10"

# --- server stack (only compiled with the `server` feature) ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"], optional = true }
axum = { version = "0.7", optional = true }
jsonwebtoken = { version = "9", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
default = []
# The HTTP server + OIDC verification stack. The library (control model, scene
# projection, grant minting) builds without it so it stays unit-testable.
server = ["dep:tokio", "dep:axum", "dep:jsonwebtoken", "dep:tracing", "dep:tracing-subscriber"]
# Durable RocksDB store, forwarded to every layer that opens it.
rocksdb = ["mem-store/rocksdb", "mem-query/rocksdb", "mem-mcp/rocksdb"]
# bge transformer embedder, so `search` works over the bge-embedded federation store.
transformer = ["mem-index/transformer", "mem-query/transformer", "mem-mcp/transformer"]
# Surface the on-chain (40204) anchor in /ops. Stubbed until the chain client is wired.
chain = []

[[bin]]
name = "mem-gateway"
path = "src/main.rs"
required-features = ["server", "rocksdb"]
