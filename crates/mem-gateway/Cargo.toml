[package]
name = "mem-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Mnemosyne backend seam: multi-Org isolation, OIDC->grant authz, and the network surface over the citrate-memories engine."

[dependencies]
mem-core = { path = "../mem-core" }
mem-store = { path = "../mem-store" }
mem-query = { path = "../mem-query" }
mem-index = { path = "../mem-index" }
mem-authz = { path = "../mem-authz" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = "2"
blake3 = { workspace = true }
# HTTP layer (feature `server`): kept optional so the security-critical core tests
# compile without the tokio/axum tree.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }
axum = { version = "0.7", optional = true }

[features]
default = []
# Open per-Org RocksDB stores (the real engine backend). Off by default so the
# control-plane + authz core tests stay fast on the in-memory path.
rocksdb = ["mem-store/rocksdb", "mem-query/rocksdb"]
# The axum HTTP/JSON read API + 3D-layout endpoint.
server = ["dep:tokio", "dep:axum"]
# Load the bge transformer embedder (needed for `search` over a bge-embedded store).
transformer = ["mem-index/transformer", "mem-query/transformer"]

[[bin]]
name = "mem-gateway"
required-features = ["server", "rocksdb"]
