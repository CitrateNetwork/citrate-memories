# citrate-memories — federated agent memory DAG ("git for agents").
# v1 first-pass workspace. See PLANSET/ for the full design.
[workspace]
resolver = "2"
members = [
    "crates/mem-core",
    "crates/mem-store",
    "crates/mem-index",
    "crates/mem-ingest",
    "crates/mem-query",
    "crates/mem-authz",
    "crates/mem-assert",
    "crates/mem-mcp",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Citrate Network / Citrate Inc."]
repository = "https://github.com/CitrateNetwork/citrate-memories"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
thiserror = "1"
# WP-1.6 crypto-shred: AEAD for per-tenant at-rest encryption; OS randomness
# for tenant key generation (keys must NOT be derivable, or shredding fails).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.2"
