SPECIFICATION Spec
CONSTANT Nodes = {n1, n2, n3}
\* Safety-only spec: a state where the finite node set is exhausted (every node
\* added and the chain fully superseded) has no enabled action. That terminal
\* state is legitimate, not a bug, so we check invariants only and do not treat
\* "no next action" as a deadlock error. (WP-0.5, 2026-06-11.)
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT Acyclic
INVARIANT LatestWellDefined
PROPERTY GrowOnly
